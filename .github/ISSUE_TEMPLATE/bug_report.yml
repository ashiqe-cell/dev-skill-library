name: Bug report
description: Report a reproducible issue in a skill or library tool
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction and relevant environment details.
    validations:
      required: true
